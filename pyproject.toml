[project]
name = "adreader"
version = "0.1.0"
description = ""
#authors = "Giovanni Bronzini <g.bronzini@gmail.com>"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "click>=8.1.8",
    "easyocr>=1.7.2",
    "jinja2>=3.1.6",
    "keyboard>=0.13.5",
    "opencv-python>=4.11.0.86",
    "pillow>=11.1.0",
    "pyautogui>=0.9.54",
    "pymupdf>=1.26.0",
    "pypdf>=5.4.0",
    "pyscreeze>=1.0.1",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.1.0",
]

[project.scripts]
adreader = "adreader.cli:cli"

